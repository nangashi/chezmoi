# 既存のPrefix(Ctrl+B)を解除してCtrl+Aに設定
set -g prefix C-t
unbind C-b

# --- 画面分割 ---
bind | split-window -h
bind - split-window -v

# Prefix + hjkl でペインを移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Prefix + Shift + hjkl でペインサイズを変更
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# マウス操作を有効にする
set -g mouse on

# コピーモードでVimキーバインドを使う
setw -g mode-keys vi

# 'v' で選択を始める
bind -T copy-mode-vi v send -X begin-selection
# 'y' でヤンク（コピー）
bind -T copy-mode-vi y send -X copy-selection
# 'V' で行選択
bind -T copy-mode-vi V send -X select-line

# 全体の背景色
set -g window-style 'bg=colour236'
# アクティブなペインの背景色（ターミナル本来の色にする）
set -g window-active-style 'bg=black'

# 設定ファイルをリロードする
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Escキーの遅延を解消
set -s escape-time 0

# ウィンドウのインデックスを1から始める
set -g base-index 1
# ペインのインデックスを1から始める
setw -g pane-base-index 1

# 256色モードを有効にする
set-option -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"


# --- プラグイン管理 ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'

# 自動復元の設定
set -g @continuum-restore 'on'

# TPMの初期化
run '~/.tmux/plugins/tpm/tpm'

# ペインタイトル表示
set -g pane-border-status top
set -g pane-border-format " [#P] #{pane_title} | #{pane_current_command} "
#bind-key L command-prompt -p "Pane title:" 'select-pane -T "%%"'

# セッション完了時に他のセッションにアタッチ
set-option -g detach-on-destroy off
